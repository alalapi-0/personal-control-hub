schema_version: "1.0"

policy:
  read_only: true
  write_external_forbidden: true
  copy_forbidden: true
  auto_git_push_forbidden: true
  priority_source_allowed:
    - user
    - rule
    - proposal
  forbidden_scan_dirs:
    - .git
    - node_modules
    - dist
    - build
    - target
    - __pycache__
    - .venv
    - venv
    - .idea
    - .cache
    - cache
    - logs
    - outputs
    - tmp
  forbidden_files:
    - .env
    - .env.local
    - .env.production
  default_watch_paths:
    - README.md
    - AGENTS.md
    - project.yaml
    - docs/ROADMAP.md

required_project_fields:
  - id
  - name
  - root_path
  - enabled
  - scan_enabled
  - profile_enabled
  - summary_enabled
  - project_type
  - priority_source
  - watch_paths

projects:
  - id: storage_governance
    name: StorageGovernance
    root_path: "~/Documents/StorageGovernance"
    enabled: true
    scan_enabled: true
    profile_enabled: true
    summary_enabled: true
    project_type: governance_program
    priority_link: null
    priority_source: user
    watch_paths:
      - STORAGE_GOVERNANCE.md
    authority_files:
      - STORAGE_GOVERNANCE.md
    hub_adapter: governance/adapters/storage_governance.yaml
    access_profile: read_only_pointer
    norm_copy_forbidden: true
    external_write_allowed: false
    notes: "当前存储治理项目；其唯一规范留在项目目录，本注册表只保存便携路径和权威指针。"

