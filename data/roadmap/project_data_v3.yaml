plan_id: PROJECT-DATA-PUBLISH-SYNC-V3
version: 3
kind: static_execution_roadmap
reader:
- owner
- Codex
- Cursor
- project_maintainer
purpose: 阶段依赖、验收单元和项目/数据源对应关系；不存当前执行状态
update_when:
- owner_scope_change
- contract_change
- registry_or_source_binding_change
activation:
  requires: explicit_owner_v3_start
  preparation_is_execution: false
  canonical_state: STATE.yaml#all_projects_governance
  execution_document: docs/all_projects_governance_execution.md
  prompt: prompts/all_projects_governance_goal_mode.md
baseline:
  observed_date: '2026-09-10'
  git_base: aef562b11c57f3d0b21d8893c5bb42c24b97ba1b
  registry_count: 26
  local_count: 24
  removed_local_count: 2
  cloud_excluded_count: 17
  source_binding_version: 5f64ad8a5b3f95094e90dedca8911014647b1cc1d7adf9ba1a1ab670890418cd
  reuse: STATE中v2证据按原版本复用，不能直接算v3验收
  preserved_gaps:
  - 空来源项目
  - 无Git/远端
  - 漫画实际重做授权
  - 已有历史CI失败
contract:
  snapshot_sections:
  - identity
  - publication
  - source_versions
  - management
  - milestones
  - metrics
  - issues
  - verification
  - delivery
  - completeness
  mapping_fields:
  - project_id
  - source_ref
  - selector_or_query_or_function
  - target_field_or_metric_id
  - conversion
  - unit
  - dimensions
  - window
  - scope_id
  - counting_basis
  - business_time
  - version_binding
  - missing_policy
  - evidence_ref
  metric_dimensions:
  - identity_and_goal
  - scope_and_progress
  - workflow
  - artifacts
  - time_and_backlog
  - window_flow
  - quality_and_rework
  - issues_and_dependencies
  - development_and_delivery
  - operation
  - resource_and_cost
  - data_quality
  round_axes:
  - stage_id
  - execution_round
  - review_stage
  - submission_attempt
  - rework_count
  - candidate_revision
  aggregate_rules:
  - scope_and_unit_compatible
  - ratios_keep_numerator_denominator
  - net_delta_is_not_throughput
  - no_mean_of_percentiles
  - unknown_not_zero
  - cost_from_telemetry_only
  mandatory_boundaries:
  - no_chart_or_ui_implementation
  - no_agent_dependency_at_runtime
  - no_editor_or_account_runtime_changes
  - no_raw_business_data_in_hub_importer
  - no_collection_triggered_business_effects
  - no_removed_local_io
  - no_unauthorized_generation_or_unrelated_storage_cleanup
  review_transition:
  - 一审未通过
  - 待重做
  - 重做中
  - 新版本待提交一审
  - 新版本待一审
  - 一审中
  - 一审通过
  - 按配置进入真正二审或验收
round_protocol:
  select: 读取STATE游标；选择依赖已通过且尚未验收的最小阶段/项目单元；局部阻塞继续独立就绪项；迁移与契约可独立推进，各项目接入前确认本项目位置/连接就绪，不因一个迁移阻塞全局。
  static_stages: 11
  rollout_project_units: 22
  forecast: 阶段和项目单元不是保证轮数；实际拆分/复用/阻塞决定逻辑轮，轮末按证据给区间及置信度
  acceptance_key: stage acceptance_id；逐项目阶段追加project_id形成独立键
  checkpoint_fields:
  - plan_version
  - stage_id
  - project_id
  - unit_id
  - acceptance_versions_and_evidence
  - failure_or_blocker
  - delivery
  - next_action
  - deduplicated_execution_rounds
  state_only: true
  deliver_each_unit: true
  no_new_round_reports: true
