legacy_mapping_seeds:
- source: manga
  reader: src/hub/metric_manga.py
  field: verdict
  values:
    pending: review_pending
    issues: correction_required
    approved: review_approved
  limits: 不据聚合计数/最大artifact_revision推断审核阶段/提交次数或最终验收；迁移须读取逐项版本与事件。
- source: pixel
  reader: src/hub/metric_catalogs.py
  field: review decision/review_status/lifecycle_status
  values:
    pending: review_pending
    under_review: review_in_progress
    approved: review_approved
    rejected: review_rejected
    retry_needed: retry_required
  limits: 三个源字段分别映射；legacy_review_status不替代决定，asset_id关联不等于审核版本绑定。
- source: anime
  reader: src/hub/metric_catalogs.py
  field: reviews.decision
  values:
    approve: review_approved
    reject: review_rejected
    needs_correction: correction_required
  limits: record.revision与内容version分开；运行状态不当审核轮，approved不当最终accepted。
- source: music
  reader: src/hub/metric_music.py
  field: run status
  values:
    pending: production_pending
    running: production_running
    succeeded: production_succeeded
    failed: production_failed
    cancelled: production_cancelled
  limits: 成功仅表示运行结果；provider_version不当作品候选版本；缺审核源保持unknown。
- source: wechat
  reader: src/hub/metric_wechat.py
  field: queue status
  values:
    pending: queue_pending
    running: queue_running
    done: queue_done
    failed: queue_failed
    waiting_confirmation: queue_waiting_confirmation
    cancelled: queue_cancelled
  limits: done/real不能证明发布或验收；凭证和内容版本单独关联。
stages:
- id: V3-01
  title: 基线、范围与项目/数据映射
  depends_on: []
  owned_scope: Hub；仅必要的项目只读核对
  work:
  - 按registry及现有来源绑定建立全登记对应关系；标明空项目、无Git、离线、移除和云排除。
  - 把v2证据绑定其原版本；列出v3新增验收，不重做已有效的源验证。
  - 存储入口目前在原工作区而不在基线main；先核对并接入必要的有效版本及状态指针，不复制历史全树或恢复过时权限。
  acceptance:
  - id: V3-01-A1
    criterion: 全登记ID无遗漏/重复；removed_local不探测路径。
  - id: V3-01-A2
    criterion: 每项目已有源/适配器/仓库/缺口可追溯；无权威来源不猜数据。
  - id: V3-01-A3
    criterion: 迁移所需唯一状态/规则入口可访问且版本归属明确；main缺失依赖已处理或保留阻塞，未解决前不得搬移。
  unit_key: V3-01/baseline；至少1个逻辑单元
  evidence: 现有STATE单元记录中的版本/命令退出结果/证据引用/对应仓库交付；不另建逐轮报告
- id: V3-02
  title: 独立子项目外置盘迁移与路径重连
  depends_on:
  - V3-01
  owned_scope: 逐个独立子项目；Hub只更新登记/入口，存储事实复用其唯一STATE
  work:
  - 按真实项目根和Git边界分类；已外置不搬，Hub内部模块留本地，removed_local不探测。
  - 整目录复制/校验/切换路径，保留Git与未提交独有内容；用汇总程序检查替代逐文件模型阅读。
  - 核对实际消费者、启动/导出入口、必要守卫与连接；目标有效后完成原目录清理，避免双份长期保留。
  acceptance:
  - id: V3-02-A1
    criterion: 所有独立现存项目在外盘或有真实阻塞；原分母/移除处置保留，Hub未移动或拆仓。
  - id: V3-02-A2
    criterion: 目标完整性、Git身份/脏内容、数据一致性和必要入口有程序证据；失败不删源、不覆盖冲突目标。
  - id: V3-02-A3
    criterion: 权威路径与实际消费者一致；真实修改到对应main，无空提交或擅自建远端。
  unit_key: V3-02/<project_id>；基线21项已外置、1项待迁，已完成有效证据复用
  evidence: 现有StorageGovernance唯一STATE及程序汇总引用；Hub不复制逐文件清单或新建迁移账本
- id: V3-03
  title: 统一Schema、模板、指标与审核词义
  depends_on:
  - V3-01
  owned_scope: Hub共享契约
  work:
  - 形成声明和生成快照的可执行Schema/校验器，统一现有管理字段与数值接口。
  - 实现并验证候选版本、真正审核阶段、同阶段提交次数、重做次数、决定、验收和交付关联；未知历史保持未知。
  - 明确12类维度、领域profile、时间窗口/聚合/缺失策略及展示配置；模板不执行任意代码。
  acceptance:
  - id: V3-03-A1
    criterion: 合法/缺失/未知/不适用/错误样例可校验，契约无歧义。
  - id: V3-03-A2
    criterion: 一审不通过进入待重做，实际新版本生成并送审后回到待一审；真正二审只在配置及一审通过后进入；旧批准不放行新版本。
  - id: V3-03-A3
    criterion: Schema/指标定义为唯一权威；声明只有稳定配置，动态事实由导出生成。
  unit_key: V3-03/contract；可按可独立验收的契约拆分
  evidence: 现有STATE单元记录中的版本/命令退出结果/证据引用/对应仓库交付；不另建逐轮报告
- id: V3-04
  title: 共享导出器与快照导入
  depends_on:
  - V3-03
  owned_scope: Hub共享库；选定项目入口单独串行
  work:
  - 复用现有读源/Git/校验代码，提供普通脚本可调用的共享导出接口。
  - 建立原子快照写入和仅消费标准快照的Hub导入器；保留独立组错误与last_success。
  acceptance:
