# MCP 服务器示例配置 — 不含真实 token
# 复制到 Cursor 用户级或项目级配置时，请用环境变量注入密钥。
# 权威登记：data/mcp/mcp_capability_registry.yaml
# 审批策略：data/mcp/mcp_approval_policy.yaml
# 这是候选示例，不代表本机已安装、项目已配置、运行时可用或动作获授权。

mcpServers:
  context7:
    enabled: false
    command: npx
    args:
      - "-y"
      - "@upstash/context7-mcp"
    env:
      CONTEXT7_API_KEY: "${CONTEXT7_API_KEY}"
    notes: "L0 文档上下文候选；默认 disabled，密钥仅放环境变量。"

  filesystem:
    enabled: false
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "/absolute/path/to/personal-control-hub"
    notes: "L1 本地文件候选；默认 disabled，路径须与白名单一致，勿指向整个用户目录。"

  github:
    enabled: false
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    notes: "L2 只读候选；默认 disabled，写操作归类 L3。"

  chrome-devtools:
    enabled: false
    command: npx
    args:
      - "-y"
      - "chrome-devtools-mcp"
    notes: "L2 浏览器调试候选；默认 disabled，需用户确认目标页面和数据范围。"

  playwright:
    enabled: false
    command: npx
    args:
      - "-y"
      - "@playwright/mcp"
    notes: "L3 自动化候选；默认 disabled，生产登录、支付、发布、破坏性 UI 操作仍禁止或需显式批准。"

  stitch:
    enabled: false
    command: npx
    args:
      - "-y"
      - "stitch-mcp"
    env:
      STITCH_API_KEY: "${STITCH_API_KEY}"
    notes: "L2 UI 探索候选；默认 disabled，密钥仅放环境变量，敏感素材和外部写入需确认。"
