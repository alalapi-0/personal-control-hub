policy:
  name: mcp_approval_policy
  version: "0.5.0"
  status: draft
  default_level: L0
  host: cursor
  last_updated: "2026-06-07"
  round_005_rule: "六个已登记 MCP 可 default start；本轮禁止真实 MCP 调用，仅登记、策略与示例配置。"
  default_start_rule: "default start 只表示可被 Cursor 工作区启用；具体动作仍按 L0-L3 审批。"

levels:
  L0:
    name: read_only_context
    confirmation_required: false
    logging_required: false
    description: "只读上下文获取，不改变本仓库或外部系统状态。"
    examples:
      - "Context7 查询公开库文档"
      - "GitHub 只读查看 issue 列表（经启用后）"
      - "Chrome DevTools 页面结构只读快照"
      - "读取 mcp_capability_registry 与 approval policy"
    agent_rule: "可继续执行，须在 automation_log 记录摘要（可选轻量）。"

  L1:
    name: local_low_risk_write
    confirmation_required: false
    logging_required: true
    description: "写入本仓库低风险文件：文档、YAML 草案、扫描输出、日志。"
    examples:
      - "更新 data/project_scans 草案"
      - "写入 MCP 审计报告到 docs/reports"
      - "Filesystem MCP 修改本仓库治理 YAML（非覆盖用户内容）"
    agent_rule: "完成后写入 data/logs/automation_log.jsonl。"

  L2:
    name: external_or_shell_low_risk
    confirmation_required: true
    logging_required: true
    description: "触及外部系统或 shell 的低风险操作，需人工确认或白名单。"
    examples:
      - "GitHub MCP 拉取 PR diff"
      - "Chrome DevTools 带登录态页面检查（用户在场）"
      - "Stitch UI 生成外部可访问草稿链接"
      - "运行本地只读 git 命令辅助扫描"
    agent_rule: "必须先停止并向用户说明范围；确认后继续并记日志。"

  L3:
    name: high_risk_write
    confirmation_required: true
    ceo_explicit_approval_required: true
    logging_required: true
    default_forbidden: true
    description: "高风险写操作：外部写入、发布、推送、自动化登录、远程控制。"
    examples:
      - "Playwright 自动登录并提交表单"
      - "GitHub push、merge、close issue"
      - "Feishu 真实消息发送"
      - "修改外部业务仓库"
      - "桌面或系统级高风险控制"
    agent_rule: "默认禁止；仅当用户/CEO 显式批准且 round_state 允许时才可执行。"

enforcement:
  cursor_is_host: true
  codex_must_not_bypass: true
  new_mcp_requires:
    - data/mcp/mcp_capability_registry.yaml
    - data/mcp/mcp_approval_policy.yaml
    - data/mcp/mcp_integration_roadmap.yaml
  token_storage: env_only
  forbidden_in_repo:
    - "真实 token、secret、cookie、API key"
  round_005_forbidden:
    - "自行安装 MCP 包"
    - "把 L3 MCP 启动状态解释为免审批执行"
    - "真实调用外部 MCP 服务"
  enabled_l3_is_not_hard_blocker: true
  hard_blocker_rule: "L3 action without approval is blocked; enabled L3 registration alone is not blocked."

logging:
  target: data/logs/automation_log.jsonl
  fields:
    - timestamp
    - agent
    - mcp_id
    - approval_level
    - action_summary
    - user_confirmed
