name: Hub checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  governance-and-connections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Governance and connection regressions
        run: python -m unittest discover -s tests -q
      - name: Complete Python regressions
        run: python -m pytest tests -q
      - name: Connection view regressions
        run: PCH_PYTHON_EXECUTABLE="$(command -v python)" node --test tests/test_pch_browser_runtime.mjs tests/test_hub_connection_view.mjs tests/test_hub_business_tasks.mjs tests/test_hub_management.mjs tests/test_hub_timeline.mjs tests/test_hub_directory.mjs tests/test_hub_page_inventory.mjs tests/test_hub_captures.mjs tests/test_hub_approval_ui.mjs tests/test_hub_web_logic.mjs tests/test_hub_business_preview.mjs tests/test_hub_business_task_ui.mjs tests/test_hub_navigation.mjs tests/test_hub_rr_navigation.mjs tests/test_hub_ledger_watch.mjs tests/test_hub_relations.mjs tests/test_hub_ordinary_tasks.mjs tests/test_hub_task_history.mjs
      - name: Repository checks
        run: python scripts/check_repo.py --task-id ALL-PROJECTS-CODEX-GOVERNANCE-V1
      - name: State consistency
        run: python scripts/round_consistency_check.py --json --task-id ALL-PROJECTS-CODEX-GOVERNANCE-V1
      - name: Registry and template validation
        run: |
          python scripts/check_registry.py --metadata-only
          python scripts/check_project_data_v3.py
          python scripts/hub_connections.py schema
          python scripts/hub_connections.py validate-declaration data/connections/hub.connection.template.yaml
