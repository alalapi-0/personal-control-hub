policy:
  name: personal_control_hub_agent_policy
  version: "1.1.0"
  status: draft
  default_mode: local_first_read_mostly
  current_round: ROUND-1-1

authority_model:
  canonical_current_state: STATE.yaml
  default_context_router: AGENTS.md
  legacy_state_files:
    - governance/round_state.yaml
    - data/state/current_status.yaml
  legacy_protocol_reference: governance/repo_protocol_standard.yaml

allowed_without_confirmation:
  - "读取本仓库文档、YAML、脚本和测试。"
  - "运行本仓库本地验证脚本。"
  - "读取外部项目注册表中的允许入口文件。"
  - "在回复或标准输出中生成外部项目 profile、snapshot、priority suggestion 和 next actions 草案。"
  - "提出 program-project link proposal。"
  - "在标准输出中生成 Codex/Cursor prompt 草案。"
  - "读取 git status、git branch、git log 和 git remote 信息，仅用于状态判断。"
  - "只读执行 hub.py mcp list 与 hub.py mcp policy。"
  - "读取 MCP registry 与策略；不得从登记状态推断配置、运行时可用或动作授权。"

requires_user_confirmation:
  - "修改外部项目本体。"
  - "删除文件。"
  - "覆盖已有用户内容。"
  - "覆盖用户已有 .cursor/mcp.json。"
  - "没有当前或已记录所有者授权时推送 GitHub。"
  - "调用真实付费 API。"
  - "调用真实 Feishu/Lark API。"
  - "调用真实外部 MCP 服务（L2+）。"
  - "写入真实 Feishu/Lark 空间。"
  - "修改真实 .env。"
  - "执行远程控制。"
  - "修改项目优先级为 P0/P1。"
  - "改变技术栈。"
  - "大规模目录迁移。"
  - "自行安装 MCP 包。"
  - "执行高风险 MCP 动作（如 playwright 真实浏览器自动化、GitHub 写操作）。"

forbidden_in_round_0:
  - "写入 token、secret、cookie、API key。"
  - "调用真实飞书、真实付费模型或真实远程控制。"
  - "把外部业务仓库复制进本仓库。"
  - "默认全量扫描外部项目。"
  - "把 LLM 建议直接作为最终优先级决策。"

forbidden_in_round_005:
  - "自行安装 MCP 包。"
  - "把 MCP 的登记、配置或运行时状态解释为动作授权。"
  - "真实调用外部 MCP API。"
  - "在仓库写入真实 token。"
  - "覆盖用户已有 .cursor/mcp.json。"

mcp_policy:
  host: cursor
  codex_must_not_bypass: true
  default_levels: ["L0", "L1"]
  registry_file: data/mcp/mcp_capability_registry.yaml
  approval_file: data/mcp/mcp_approval_policy.yaml
  roadmap_file: data/mcp/mcp_integration_roadmap.yaml
  new_mcp_requires:
    - data/mcp/mcp_capability_registry.yaml
    - data/mcp/mcp_approval_policy.yaml
    - data/mcp/mcp_integration_roadmap.yaml
  l2_l3_must_stop_for_confirmation: true
  external_tool_logging: data/logs/automation_log.jsonl
  logging_requires_separate_current_authority: true
  token_storage: env_only
  round_005_no_real_calls: true

auto_advance_policy:
  enabled: true
  policy_file: data/gates/auto_advance_policy.yaml
  gate_script: scripts/agent_gate.py
  runner_script: scripts/auto_advance_runner.py
  require_gate_before_round: true
  require_consistency_check: true
  default_continue_without_hard_blocker: true
  rules:
    - "每轮开始前必须运行 python scripts/agent_gate.py 与 python scripts/auto_advance_runner.py --mode check。"
    - "gate 输出 continue 时只表示检查通过；仅在当前已有上级授权范围内继续。"
    - "gate 输出 warn_and_continue 时报告 warning，并仅在当前已有授权范围内继续。"
    - "gate 输出 stop 时必须停止并请求用户确认。"
    - "没有 hard blocker 不要因偏好不完美而停下。"
    - "可用保守默认值时使用保守默认值。"
    - "只有 hard blocker 才请求用户。"
    - "只有当前任务授权且当前事实改变时才更新 STATE.yaml；兼容状态文件不再作为权威。"
    - "finalize-round 只做验证和风险报告，永不暂存、commit 或 push。"
    - "prepare-next 只向标准输出预览下一轮 prompt，不写队列文件。"
    - "涉及代码修改必须运行最小验证。"
    - "两次连续尝试没有进展时诊断并改变方法；真实边界才请求用户。"
    - "软阻塞在回复中报告；是否继续仍取决于当前已有上级授权。"
  hard_blocker_examples:
    - "真实 API key、密码、cookie。"
    - "写入外部项目。"
    - "删除文件或覆盖用户内容。"
    - "未获当前或已记录所有者授权的 git push、发布内容、登录账号、支付或购买。"
    - "改变 P0/P1 战略优先级。"
    - "MCP L2/L3 未获确认。"
  soft_blocker_examples:
    - "UI 美术风格未确定。"
    - "文案可后续优化。"
    - "缺少真实飞书 webhook 或 GitHub token，但可用 mock。"
    - "LLM 不可用但可用 mock。"
    - "future round 不够细。"
  default_start_policy: "六个 MCP 仅为登记候选且默认 disabled；配置、运行时可用和动作授权分别判断。"
  enabled_l3_is_not_hard_blocker: true

approval_levels:
  L0:
    name: read_only_context
    confirmation_required: false
    examples:
      - "Context7 公开文档查询（启用后）"
      - "读取 MCP registry 与 policy"
  L1:
    name: local_low_risk_write
    confirmation_required: true
    logging_required: true
    examples:
      - "当前任务明确授权的本仓库文档与 YAML 更新"
      - "当前任务明确授权的 automation_log.jsonl 记录"
  L2:
    name: external_or_shell_low_risk
    confirmation_required: true
    logging_required: true
    examples:
      - "GitHub MCP 只读拉取 PR"
      - "Chrome DevTools 页面检查"
  L3:
    name: high_risk_write
    confirmation_required: true
    ceo_explicit_approval_required: true
    default_forbidden: true
    examples:
      - "Playwright 自动登录"
      - "GitHub push"
      - "Feishu 真实发送"

legacy_approval_levels:
  low:
    examples:
      - "本仓库新增文档。"
      - "本仓库新增空目录占位。"
  medium:
    examples:
      - "修改现有权威文档。"
      - "新增项目扫描脚本。"
  high:
    examples:
      - "修改外部项目。"
      - "真实集成 API。"
      - "远程控制。"
      - "GitHub push。"

task_state_policy:
  completed_means: "Agent 声称完成并提供证据。"
  accepted_means: "用户或明确 Gate 验收通过。"
  rule: "completed 与 accepted 必须分离记录。"

git_delivery_policy:
  owner_directive_recorded_on: "2026-08-29"
  authorized_unit: accepted_milestone_or_governance_round
  commit_scope: one_task_scoped_commit
  push_scope: current_tracking_branch_only
  requires_clean_validation: true
  requires_independent_review_for_control_plane: true
  automatic_main_merge: false
  force_push: false
  remote_change: false
  secret_bearing_commit: false
  runner_may_commit_or_push: false
