schema_version: '2.0'
project_id: personal-control-hub
source_refs:
- id: state
  path: STATE.yaml
  format: yaml
  role: current_state
metric_export:
  entry: scripts/export_hub_metric_snapshot.py
  snapshot: .hub/status.json
mapping:
  current_work.objective:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, objective]
    value_map: null
  current_work.phase:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, phase]
    value_map: null
  current_work.round:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, round]
    value_map: null
  current_work.status:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, status]
    value_map: null
  current_work.completed:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, completed]
    value_map: null
  current_work.accepted:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, accepted]
    value_map: null
  current_work.next_action:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, current_work, next_action]
    value_map: null
  progress.completed:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, progress, completed]
    value_map: null
  progress.total:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, progress, total]
    value_map: null
  progress.counting_basis:
    source_ref: state
    selector:
      path: [pch_refactor, rebuild_planning_20261020, hub_source_view, progress, counting_basis]
    value_map: null
unknown_fields:
  current_work.objective: The bounded rebuild sourceview does not publish a current objective.
  current_work.phase: The bounded rebuild sourceview does not publish a current phase.
  current_work.round: The bounded rebuild sourceview does not publish a current round.
  current_work.status: The bounded rebuild sourceview does not publish a recognized lifecycle status.
  current_work.completed: The bounded rebuild sourceview does not publish an independent completion boolean.
  current_work.accepted: The bounded rebuild sourceview does not publish an independent acceptance boolean.
  current_work.next_action: The bounded rebuild sourceview does not publish a next action.
  current_work.owner_role: The bounded rebuild sourceview does not publish an actor or owner role; neither is inferred from Agent identity.
  progress.completed: The bounded rebuild sourceview does not publish its full-acceptance numerator.
  progress.total: The bounded rebuild sourceview does not publish its original product-task denominator.
  progress.counting_basis: The bounded rebuild sourceview does not publish a source counting basis; historical 107/111 is a separate scope.
  progress.milestones: Acceptance history is hash-linked state history, not a current milestone array.
  blockers: Compact unresolved summaries are not typed blocker records.
  verification.status: The latest review belongs to the prior completed unit and is not rebound to the active cursor.
  verification.evidence_refs: Review and delivery evidence remain structured state fields, not one string array.
  verification.accepted_basis: Prior-unit acceptance evidence is not current-unit verification.
  delivery.status: The latest delivery belongs to the prior completed unit, not the active cursor.
  delivery.remote: The compact state does not duplicate the configured Git remote.
  delivery.branch: The compact state does not duplicate the configured target branch.
  delivery.commit: A prior-unit main commit is not the active unit's delivery commit.
  delivery.receipt_ref: CI identity is structured delivery metadata, not a string receipt pointer.
extensions:
  schema_version: '1.4'
  fact_mapping:
    project_definition:
      source_ref: state
      selector:
        path: [pch_refactor, rebuild_planning_20261020, hub_source_view, definition]
  unknown_fields:
    project_definition: The bounded rebuild sourceview does not publish a long-term project definition.
validation_entry:
- python3 scripts/export_hub_metric_snapshot.py --help
max_read_age_seconds: 604800
